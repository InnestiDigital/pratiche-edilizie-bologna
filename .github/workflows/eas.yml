name: EAS Build & Submit

# Manual trigger only — EAS cloud builds cost credits, so nothing builds on push.
# To add tag-driven releases later, add `push: { tags: ['v*'] }` and give
# `platform`/`submit` fallback values (workflow_dispatch inputs are empty on push).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [ios, android, all]
        default: ios
      submit:
        description: Auto-submit to the store after the build finishes
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # Fail the run before spending a build if the pure lib/ suite is red.
      - run: npm run test

      # --no-wait: EAS runs the (long) build on its servers and the runner exits in ~1 min.
      # --auto-submit: EAS queues the store submission to fire when the build succeeds.
      # Build number is managed remotely (appVersionSource: remote) so runs never collide.
      - name: Build (+ auto-submit)
        run: |
          FLAGS="--platform ${{ inputs.platform }} --profile production --non-interactive --no-wait"
          if [ "${{ inputs.submit }}" = "true" ]; then FLAGS="$FLAGS --auto-submit"; fi
          eas build $FLAGS
